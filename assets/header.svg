  <text x="54" y="143" fill="#F3EEE4" font-family="Georgia, 'Times New Roman', serif" font-size="58">Mateusz Juszczyk</text>
  <text x="57" y="190" fill="#E7A184" font-family="Arial, Helvetica, sans-serif" font-size="22">Interfaces, systems,</text>
  <text x="57" y="222" fill="#E7A184" font-family="Arial, Helvetica, sans-serif" font-size="22">and the details in between.</text>
  <path d="M56 264H715" stroke="#3B3D36"/>
  <text x="57" y="299" fill="#ABA99D" font-family="monospace" font-size="13" letter-spacing="1.3">WEB DEVELOPMENT / APPLIED AI / HARDWARE DESIGN</text>
  <g transform="translate(825 125) rotate(-8 150 85)">
