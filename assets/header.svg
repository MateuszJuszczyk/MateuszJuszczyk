    <rect width="298" height="150" rx="10" fill="#20221E" stroke="#8D8D77" stroke-width="1.5"/>
    <g fill="#2A2D26" stroke="#767B65" stroke-opacity=".8">
      <use href="#key" x="12" y="12" fill="#A96E55"/><use href="#key" x="43" y="12"/><use href="#key" x="74" y="12"/><use href="#key" x="105" y="12"/><use href="#key" x="136" y="12"/><use href="#key" x="167" y="12"/><use href="#key" x="198" y="12"/><use href="#key" x="229" y="12"/><use href="#key" x="260" y="12"/>
