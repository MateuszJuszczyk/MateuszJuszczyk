<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" fill="none">
  <title>Mateusz Juszczyk — interfaces, systems, and the details in between.</title>
  <desc>A warm charcoal banner with cream typography, a coral accent, and a schematic mechanical keyboard.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#F1EBDD" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="glow" x1="840" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D78065" stop-opacity=".12"/>
      <stop offset="1" stop-color="#D78065" stop-opacity="0"/>
    </linearGradient>
    <rect id="key" width="24" height="24" rx="4"/>
  </defs>
  <rect width="1200" height="350" rx="16" fill="#191A18"/>
  <rect width="1200" height="350" rx="16" fill="url(#grid)"/>
  <rect x="780" width="420" height="350" rx="16" fill="url(#glow)"/>
  <path d="M54 58H82" stroke="#E7A184" stroke-width="3"/>
